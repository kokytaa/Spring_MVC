<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
     layout:decorate="layout1.html"><!-- xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
-->


<head>
    <meta charset="UTF-8">
    <title>Products</title>
    <script src="/webjars/bootstrap/5.3.5/js/bootstrap.bundle.js"></script>
</head>
<body>
<div class="p-3" layout:fragment="content1">

    <table class="table">
        <thead>
        <th>ID</th><th>Name</th><th>Price</th><th>Quantity</th>
        </thead>
        <tbody>
        <tr th:each="p:${productList}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.name}"></td>
            <td th:text="${p.price}"></td>
            <td th:text="${p.quantity}"></td>
            <td>
            <a  class="btn btn-danger" onclick="return confirm('etes vous sure?')"
                th:href="@{/delete(id=${p.id})}">Delete</a>
            </td>

        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
